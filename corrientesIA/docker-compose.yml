version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: corrientesia-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: changeme
      MYSQL_DATABASE: corrientesia
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pchangeme"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/src/CorrientesIA.Api/Dockerfile
    container_name: corrientesia-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Server=mysql;Port=3306;Database=corrientesia;User=root;Password=changeme;"
    ports:
      - "5080:8080"

volumes:
  mysql_data:
